<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Gastos</title>
  <meta name="description" content="Controle de gastos pessoais por mês, com resumo, gráfico por categoria e exportação em CSV.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">
    <header>
      <h1>Controle de Gastos</h1>
      <label class="mes">Mês
        <input type="month" id="mes">
      </label>
    </header>

    <section class="resumo" aria-label="Resumo do mês">
      <div class="saldo"><small>Saldo</small><strong id="saldo"></strong></div>
      <div><small>Receitas</small><strong id="receitas" class="pos"></strong></div>
      <div><small>Despesas</small><strong id="despesas" class="neg"></strong></div>
    </section>

    <h2>Novo lançamento</h2>
    <form id="form" class="form">
      <select id="tipo" aria-label="Tipo">
        <option value="despesa">Despesa</option>
        <option value="receita">Receita</option>
      </select>
      <input id="descricao" type="text" placeholder="Descrição" aria-label="Descrição" maxlength="80" autocomplete="off">
      <input id="valor" type="number" placeholder="Valor (R$)" aria-label="Valor em reais" step="0.01" min="0.01">
      <select id="categoria" aria-label="Categoria"></select>
      <input id="data" type="date" aria-label="Data">
      <button type="submit">Adicionar</button>
    </form>
    <p id="erro" role="alert"></p>

    <h2>Despesas por categoria</h2>
    <div id="grafico"></div>

    <h2>Lançamentos</h2>
    <table>
      <thead>
        <tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="valor">Valor</th><th><span class="sr">Ações</span></th></tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
    <p id="vazio" hidden>Nenhum lançamento neste mês.</p>

    <button type="button" id="exportar" class="secundario">Exportar CSV do mês</button>
  </div>

  <script src="finance.js"></script>
  <script src="app.js"></script>
</body>
</html>
